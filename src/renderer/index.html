<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>overlay</title>
  </head>
  <body>
    <div id="root">
      <!-- The always-visible top bar (centered pill). -->
      <div class="bar interactive" id="bar">
        <button class="seg listen" id="listenBtn">
          <span class="dot" id="audioDot"></span>
          <span id="listenLabel">Listen</span>
          <span class="timer" id="timer" hidden>00:00</span>
        </button>

        <span class="divider"></span>

        <button class="seg primary" id="askBtn">
          Ask AI <span class="keys" data-keys="mod,↵"></span>
        </button>

        <button class="seg" id="screenBtn">
          Screen <span class="keys" data-keys="mod,⇧,↵"></span>
        </button>

        <span class="divider"></span>

        <button class="seg icon" id="kbBtn" title="Add reference material (résumé, docs)">
          📎<span class="badge" id="kbCount" hidden>0</span>
        </button>

        <button class="seg" id="hideBtn">
          Hide <span class="keys" data-keys="mod,\"></span>
        </button>
      </div>

      <!-- The response panel drops down below the bar when active. -->
      <div class="panel interactive" id="panel" hidden>
        <nav class="actions" id="actions"></nav>
        <section class="transcript" id="transcript" hidden></section>
        <main class="answer" id="answer">
          <div class="placeholder">Ask anything, or press the shortcut.</div>
        </main>
        <div class="input-row">
          <input
            id="prompt"
            type="text"
            placeholder="Ask a follow-up…"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="send" class="send" title="Ask">↵</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
