<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>overlay</title>
  </head>
  <body>
    <div id="root">
      <!-- Top pill bar -->
      <div class="bar interactive" id="bar">
        <span class="logo" id="logo">✦</span>
        <button class="seg listen" id="listenBtn">
          <span class="dot" id="audioDot"></span>
          <span id="listenLabel">Listen</span>
          <span class="timer" id="timer" hidden>00:00</span>
        </button>
        <button class="seg primary" id="askBtn">
          Ask AI <span class="keys" data-keys="mod,↵"></span>
        </button>
        <button class="seg ghost" id="hideBtn">Hide <span class="chev">⌄</span></button>
      </div>

      <!-- Response panel -->
      <div class="panel interactive" id="panel" hidden>
        <div class="qbubble" id="qbubble" hidden></div>

        <div class="answer" id="answer">
          <div class="placeholder">Ask anything, or press the shortcut for Assist.</div>
        </div>

        <div class="transcript" id="transcript" hidden></div>

        <nav class="actions" id="actions"></nav>

        <div class="composer">
          <div class="composer-input">
            <input
              id="prompt"
              type="text"
              placeholder="Ask about your screen or conversation"
              autocomplete="off"
              spellcheck="false"
            />
            <div class="composer-tools">
              <button class="smart" id="kbBtn" title="Add reference material (résumé, docs)">
                📎 Knowledge<span class="badge" id="kbCount" hidden>0</span>
              </button>
            </div>
          </div>
          <button class="send" id="send" title="Ask">➤</button>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
